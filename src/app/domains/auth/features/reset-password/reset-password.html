<section>
  <p class="mb-4 text-sm text-gray-500">
    Vous avez un compte?&nbsp;
    <a routerLink="/auth/sign-in" class="text-primary-500 underline font-medium">Connectez-vous! </a>
  </p>
  <p class="mt-1.5">Veuillez saisir votre nouveau mot de passe pour réinitialiser votre compte.</p>
  <form class="mt-8 flex flex-col gap-4" (submit)="onResetPassword(); $event.preventDefault()">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Mot de passe</mat-label>
      <input
        matInput
        [type]="hidePassword ? 'password' : 'text'"
        [formField]="resetPasswordForm.password"
        autocomplete="new-password" />
      <button matIconButton matSuffix type="button" (click)="hidePassword = !hidePassword">
        <mat-icon [svgIcon]="hidePassword ? 'eye' : 'eye-off'" />
      </button>
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Confirmer le mot de passe</mat-label>
      <input
        matInput
        [type]="hidePasswordConfirmation ? 'password' : 'text'"
        [formField]="resetPasswordForm.password_confirm"
        autocomplete="new-password" />
      <button matIconButton matSuffix type="button" (click)="hidePasswordConfirmation = !hidePasswordConfirmation">
        <mat-icon [svgIcon]="hidePasswordConfirmation ? 'eye' : 'eye-off'" />
      </button>
    </mat-form-field>
    <button
      matButton="filled"
      [disabled]="store.isLoading() || resetPasswordForm().invalid()"
      class="mt-4 w-full"
      type="submit">
      @if (store.isLoading()) {
        <mat-spinner diameter="18" />
      }
      <span>{{ store.isLoading() ? 'Réinitialisation…' : 'Réinitialisation' }}</span>
    </button>
  </form>
</section>
