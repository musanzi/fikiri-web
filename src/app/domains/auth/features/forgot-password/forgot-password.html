<section>
  <p class="mb-4 text-sm text-gray-500">
    Vous avez un compte?&nbsp;
    <a routerLink="/auth/sign-in" class="text-primary-500 underline font-medium">Connectez-vous! </a>
  </p>
  <p class="mt-1.5">Réinitialisez votre mot de passe un lien de réinitialisation vous sera envoyé.</p>
  @if (store.error()) {
    <app-message
      class="mt-5 mb-5"
      type="error"
      title="Envoi impossible"
      [message]="store.error()"
      (dismissed)="store.clearError()" />
  }
  <form class="mt-6 flex flex-col gap-4" (submit)="onForgotPassword(); $event.preventDefault()">
    <mat-form-field appearance="outline" class="mb-3 w-full">
      <mat-label>Adresse e-mail</mat-label>
      <input matInput type="email" [formField]="forgotPasswordForm.email" autocomplete="email" />
    </mat-form-field>
    <div class="-mt-5 inline-flex w-full items-center justify-between">
      Mot de passe?
      <a class="text-md font-medium text-primary-400 hover:underline" [routerLink]="['/auth/sign-in']">
        Connectez-vous!
      </a>
    </div>
    <button
      matButton="filled"
      [disabled]="store.isLoading() || forgotPasswordForm().invalid()"
      class="mt-4 w-full"
      type="submit">
      <span>{{ store.isLoading() ? 'Envoi…' : 'Réinitialisation' }}</span>
    </button>
  </form>
</section>
