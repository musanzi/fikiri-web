<h2 mat-dialog-title>Supprimer la solution</h2>

<mat-dialog-content>
  Voulez-vous vraiment supprimer la solution <strong>{{ data.solution.name || 'Sans nom' }}</strong> ? Cette action est
  irréversible.
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton type="button" [mat-dialog-close]="false">Annuler</button>
  <button matButton="filled" type="button" [mat-dialog-close]="true">Supprimer</button>
</mat-dialog-actions>
