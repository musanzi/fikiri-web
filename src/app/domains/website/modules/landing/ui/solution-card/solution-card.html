<article
  class="group h-full overflow-hidden rounded-md border border-gray-200 bg-white transition duration-300 hover:border-primary-200 hover:shadow-xl hover:shadow-gray-900/8">
  <a [routerLink]="['/solutions', solution().slug]" class="flex h-full flex-col">
    <div class="relative overflow-hidden bg-gray-100">
      <img
        [src]="solutionImage(solution().image)"
        [alt]="solution().name || 'Solution primée'"
        class="aspect-4/3 w-full object-cover transition duration-500 group-hover:scale-105" />
      <span
        class="absolute left-4 top-4 rounded-full bg-white/90 px-3 py-1.5 text-xs font-semibold text-gray-800 shadow-sm backdrop-blur">
        Champion Fikiri
      </span>
    </div>
    <div class="flex flex-1 flex-col p-5">
      <h3 class="line-clamp-2 text-lg font-bold leading-6 text-gray-950">
        {{ solution().name || 'Solution innovante' }}
      </h3>
      <div class="mt-3 flex items-center gap-3 border-t border-gray-100 pt-5">
        <img
          [src]="profileImage(solution().user)"
          [alt]="solution().user?.name || 'Porteur de la solution'"
          class="size-10 shrink-0 rounded-full bg-gray-200 object-cover" />
        <div class="min-w-0 text-sm">
          <p class="truncate font-semibold text-gray-900">
            {{ solution().user?.name || 'Porteur de solution' | titlecase }}
          </p>
          <p class="truncate text-gray-500">{{ solution().created_at | date: 'longDate' }}</p>
        </div>
        <span aria-hidden="true" class="ml-auto text-lg text-gray-300 transition group-hover:text-primary-600">↗</span>
      </div>
    </div>
  </a>
</article>
