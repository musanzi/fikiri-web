<h2 mat-dialog-title>{{ data.role ? 'Modifier le rôle' : 'Créer un rôle' }}</h2>

<form (submit)="onSubmit(); $event.preventDefault()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
      <mat-label>Nom</mat-label>
      <input matInput [formField]="roleForm.name" autocomplete="off" />
      @if (roleForm.name().touched() && roleForm.name().errors().length) {
        <mat-error>{{ roleForm.name().errors()[0].message }}</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" [mat-dialog-close]="undefined">Annuler</button>
    <button matButton="filled" type="submit" [disabled]="roleForm().invalid()">
      {{ data.role ? 'Enregistrer' : 'Créer' }}
    </button>
  </mat-dialog-actions>
</form>
